<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <h1>Ragistration Process</h1>
    <form>
        <label for="username">your name:</label>
     <input name="username" id="username" type="text" placeholder="full name" required>
     <br>

     <label for="email">Your Email:</label>
    <input name="email" id="email" type="text" placeholder="example@gmail.com" required>
    <br>

    <label for="pw">password:</label>
    <input type="password" name="password" id="pw" placeholder="password" required>
    <br>
    <label for="number">phone number:</label>
    <input type="number" name="number" id="number" required>
    <br>

    <label for="date">date of birth :</label>
    <input type="date" name="date" id="date">
    <br>
     <label for="color">your favourite color:</label>
    <input type="color" name="color" id="color" value="#ff0000">
    <br>
    <label for="file">upload here your resume:</label>
    <input type="file" name="file" id="file">
    <br>
    <label><input type="radio" name="gender" value="male">male</label>
    <label><input type="radio" name="gender" value="female">female</label>
    <label><input type="radio" name="gender" value="other">other</label>
    <br>
    
    <p>your course subject</p>
    <label><input type="checkbox" name="subjects" value="webdevelopment">webdevelopment</label>
    <label><input type="checkbox" name="subjects" value="dsa">DSA</label>
    <label><input type="checkbox" name="subjects" value="c programming">c languages</label>
    <br>
    <p><label for="branch">branch:</label>
    <select name="branch" id="branch">
        <option>BCA</option>
        <option>B.tech</option>
    </select></p>
    <br>
    
    <p><label for="msg">why do you want to join this?</label><br>
    <textarea name="msg" id="msg" rows="4" cols="40"></textarea></p>
    <br>
    <button type="reset"> click here to reset</button>
    <button type="submit">Register</button>
    </form>

</body>
</html>
